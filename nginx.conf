server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;

    # Docker's embedded DNS. Resolving through a variable (rather than a
    # literal upstream) keeps nginx from refusing to start when the backend
    # isn't up yet, and re-resolves the name so a backend restart on a new IP
    # is picked up instead of cached forever.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # The site's JS calls /api/... and /uploads/... on its own origin.
    # Proxying them here means no CORS and no rebuild when the domain changes.
    # "backend" is the compose service name of the API.
    set $api_upstream http://backend:4001;

    location /api/ {
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
